[project]
name = "smart-qora-backend"
version = "0.1.0"
description = "AI livestock gate monitoring — FastAPI backend"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Real-bug checks only; the codebase deliberately uses compact multi-statement lines.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
