# BoT-SORT with appearance ReID + thresholds tuned for a dense flock, drone view.
# Opt-in (TRACKER=botsort_reid.yaml). On the ICAERUS test clips it did NOT beat
# plain botsort.yaml with `model: auto` (YOLO detect models have no ReID head);
# it earns its keep only with a real ReID model — set `model:` to an osnet path.

tracker_type: botsort
track_high_thresh: 0.30      # cleaner first-stage matches
track_low_thresh: 0.10
new_track_thresh: 0.40       # do not spawn a new id for a weak/edge blob
track_buffer: 60             # ~2 s at 30 fps — survive occlusion in the flock
match_thresh: 0.75
fuse_score: true

gmc_method: sparseOptFlow    # compensate the moving drone camera

with_reid: true              # appearance model re-links occluded tracks
model: auto                  # reuse the detector's features (no extra weights)
proximity_thresh: 0.50
appearance_thresh: 0.70
