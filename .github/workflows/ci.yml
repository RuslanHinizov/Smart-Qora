name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Lint
        run: ruff check backend
      - name: Tests
        working-directory: backend
        run: pytest -q

  migrations-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smart_qora
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_qora"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/smart_qora
      MODEL_PATH: does-not-exist.pt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: alembic upgrade head
        working-directory: backend
        run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t smart-qora-backend ./backend
      - name: Build frontend image
        run: docker build -t smart-qora-frontend ./frontend

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, migrations-postgres, frontend, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push images
        run: |
          TAG="${GITHUB_REF_NAME}"
          for svc in backend frontend; do
            IMG="ghcr.io/${GITHUB_REPOSITORY,,}-${svc}"
            docker build -t "$IMG:$TAG" -t "$IMG:latest" ./$svc
            docker push "$IMG:$TAG"
            docker push "$IMG:latest"
          done
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LICENSE
            NOTICE
          generate_release_notes: true
